spring.application.name=fsign_backend


server.port=8080

# API Document
open.api.title=FSIGN API
open.api.version=v2.0.0
open.api.description=FSIGN API version 1.0.0

# Database Configuration
spring.datasource.url=jdbc:postgresql://171.244.142.43:5432/fsign
spring.datasource.username=postgres
spring.datasource.password=slm123slm123

# Flyway Configuration - Flyway sở hữu schema, Hibernate KHÔNG được tự sửa (ddl-auto=none)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
# Đặt true CHỈ khi muốn xoá sạch schema ở môi trường dev. KHÔNG bật ở server dùng chung.
spring.flyway.clean-disabled=true

# JPA (Hibernate) Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

#JWT's key
constant.key.signer-key=h1+1yyey6bWbtUuFTU24M8b+ARF0h0vv8rbuj+ncR6KdByL332FDZ72pEtEy+2Mz


# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.sunmoon.backend.controllers
springdoc.show-actuator=true


#File storage config
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=600MB
spring.servlet.multipart.enabled=true

# MinIO Configuration
minio.endpoint=http://171.244.142.43:9000
minio.endpointui=http://171.244.142.43:9001
minio.domain=https://minio.abc
minio.accessKey=admin
minio.secretKey=slm123slm123
minio.bucketName=unitelfms

# Redis Configuration
spring.data.redis.host=171.244.142.43
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.repositories.enabled=false
spring.data.redis.password=slm123slm123

spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1000ms


# HikariCP Configuration
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=UnitelFmsHikariPool

# Transaction Configuration
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED



spring.jackson.default-property-inclusion=non_null

# Logging
spring.datasource.hikari.leak-detection-threshold=60000
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.example=INFO
logging.level.software.amazon.awssdk=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

#health checking api config
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

spring.kafka.bootstrap-servers=171.244.142.43:29092

# Consumer
spring.kafka.consumer.group-id=gps-processor
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false