server {
    listen 5173;
    listen [::]:5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CMS có nạp video ký hiệu (backend cho tối đa 500MB mỗi tệp)
    client_max_body_size 600m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # /basic-api/xxx  ->  backend /xxx   (giống hệt proxy lúc dev trong vite.config.ts)
    location /basic-api/ {
        # Dùng DNS nội bộ của Docker và biến, KHÔNG viết thẳng tên container vào proxy_pass:
        # nginx chỉ phân giải tên một lần lúc khởi động, backend khởi động lại đổi IP là hỏng
        # cho tới khi reload nginx. Có resolver + biến thì nó tra lại mỗi 10 giây.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://fsign-backend:8080;

        rewrite ^/basic-api/(.*)$ /$1 break;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Sinh mẫu AI cho một từ chạy đồng bộ, vài giây mỗi video — đừng cắt sớm
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Tệp có băm trong tên, đổi nội dung là đổi tên -> lưu đệm lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi đường dẫn không phải tệp đều trả index.html cho vue-router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }
}
