server {
    listen 5174;
    listen [::]:5174;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chấm điểm AI gửi landmark của ~300 khung hình (vài trăm KB), không gửi video
    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # /api/... giữ nguyên đường dẫn (backend đã có sẵn tiền tố /api/v1)
    location /api/ {
        # Xem ghi chú về resolver trong nginx-cms.conf
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://fsign-backend:8080;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # WASM + model MediaPipe: ~20MB, chỉ đổi khi nâng cấp thư viện.
    # Không có kiểu MIME đúng cho .wasm thì trình duyệt từ chối biên dịch nhanh.
    location /mediapipe/ {
        types { application/wasm wasm; application/octet-stream task; }
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
